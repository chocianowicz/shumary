[project]
name = "shumary"
version = "0.1.0"
description = "Audio to detailed markdown transcripts — diarization, mood, and prosody signals, fast and local."
requires-python = ">=3.11,<3.13"
dependencies = [
    "openai-whisper>=20240101",
    "pyannote.audio>=3.1",
    "torch>=2.0",
    "torchaudio>=2.0",
    "typer>=0.9.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "resemblyzer>=0.1.1.dev0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
# Faster transcription backends (Phase 3 — Spec 3). openai-whisper (the
# fallback) is in the base dependencies above. Install whichever applies:
#   - mlx-whisper: Apple Silicon only, ~5-10x faster than openai-whisper.
#   - faster-whisper: CTranslate2-based, ~4x faster, built-in VAD.
mlx = [
    "mlx-whisper>=0.4.0",
]
faster = [
    "faster-whisper>=1.0.0",
]
# Acoustic prosody extraction (Phase 7 — Spec 7): pitch, energy, and voice-
# quality (jitter/shimmer) features computed on the Phase 3 WAV. The
# `prosody` stage degrades gracefully (skips, with a warning) when these are
# not installed.
prosody = [
    "librosa>=0.10.0",
    "praat-parselmouth>=0.4.0",
]

[project.scripts]
shumary = "shumary.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shumary"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
